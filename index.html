  ov.innerHTML=`<style>${style}
    @media print{body>*:not(#__pov){display:none!important}#__pov{position:static!important;overflow:visible!important}#__ptb{display:none!important}.no-print{display:none!important}}</style>

  </div>
  <div style="padding:20px 24px">${body}</div>`;
  document.body.appendChild(ov);

async function shareBlob(blob,fname){
  // Try native share (mobile)
  const file=new File([blob],fname,{type:blob.type});

.po{background:rgba(255,107,107,.15);color:var(--rd)}.pc{background:rgba(79,158,248,.15);color:var(--bl)}.pm2{background:rgba(29,200,160,.15);color:var(--gn)}
.w-main{padding:18px 16px;max-width:920px;margin:0 auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,rgba(29,200,160,.1) 0%,transparent 60%),var(--bg)}
.lc{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:44px 36px;width:100%;max-width:380px}
.logo-big{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;color:var(--ac);line-height:1}
.logo-sub{color:var(--mt);font-size:11px;margin-top:3px;margin-bottom:28px;letter-spacing:1.5px;text-transform:uppercase}
.hint-box{margin-top:16px;background:rgba(29,200,160,.05);border:1px solid rgba(29,200,160,.12);border-radius:8px;padding:12px;font-size:12px;color:var(--mt);line-height:2.4}
.job-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:border-color .15s}
.job-card.running{border-color:var(--gn);background:rgba(29,200,160,.04)}
.job-card.paused{border-color:var(--or);background:rgba(255,169,64,.04)}

.dot{width:7px;height:7px;border-radius:50%;background:var(--gn);display:inline-block;animation:blink 1s infinite;margin-right:4px}

.start-zone{border:2px dashed var(--bd);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px}
.start-zone:hover{border-color:var(--ac);background:rgba(29,200,160,.04)}
.pay-r{border-left:3px solid var(--gn)!important}.pay-o{border-left:3px solid var(--or)!important}.pay-x{border-left:3px solid var(--rd)!important}

@media(max-width:768px){
  .sidebar{display:none!important}
  .main-area{margin-left:0}
  .charts-row{grid-template-columns:1fr}
  .job-timer{font-size:26px;min-width:70px}
  .pg-body{padding-top:56px}
}
@media(min-width:769px){
  .mob-sidebar{display:none!important}
}
@media(max-width:480px){.fg{grid-template-columns:1fr}.fg3{grid-template-columns:1fr 1fr}.sg{grid-template-columns:1fr 1fr}.job-controls{flex-direction:row}}

const G=()=><style>{CSS}</style>;
function Toast({msg,onDone}){useEffect(()=>{const t=setTimeout(onDone,2400);return()=>clearTimeout(t);},[]);return <div className="toast">✓ {msg}</div>;}
const SBadge=({job})=>{const s=STATUS[pSt(job)];return <span style={{display:"inline-flex",alignItems:"center",padding:"3px 9px",borderRadius:20,fontSize:11,fontWeight:700,background:s.bg,color:s.color}}>{s.label}</span>;};

function ClientPicker({type,setType,name,setName,companies,recentClients=[],onAddCo}){
  const [add,setAdd]=useState(false);const [val,setVal]=useState("");
  const doAdd=()=>{const n=val.trim();if(n){onAddCo(n);setName(n);setVal("");setAdd(false);}};
  return <>
    <div className="f"><label>Client Type</label><div className="pills">
      <div className={"pt"+(type==="private"?" on":"")} onClick={()=>{setType("private");setName("");}}>👤 Private</div>
      <div className={"pt"+(type==="company"?" on":"")} onClick={()=>{setType("company");setName("");}}>🏢 Company</div>
    </div></div>
    {type==="private"&&<div className="f">
      <label>Client Name{name&&<span style={{color:"var(--ac)",textTransform:"none",letterSpacing:0,fontWeight:400}}> ✓ {name}</span>}</label>
      {recentClients.length>0&&<><div style={{fontSize:10,color:"var(--mt)",fontWeight:600,textTransform:"uppercase",letterSpacing:1,marginBottom:5,marginTop:2}}>Recent</div>
      <div className="pills" style={{marginBottom:8}}>
        {recentClients.map(cl=><div key={cl} className={"pt"+(name===cl?" on":"")} onClick={()=>setName(cl)}>{cl}</div>)}
      </div></>}
      <input value={name} onChange={e=>setName(e.target.value)} placeholder={recentClients.length>0?"Or type new name…":"Type client name…"} style={{background:"var(--s2)",border:"1px solid var(--bd)",borderRadius:8,padding:"10px 12px",color:"var(--tx)",fontFamily:"Inter,sans-serif",fontSize:13,outline:"none",width:"100%"}}/>
    </div>}
    {type==="company"&&<div className="f">
      <label>Company{name&&<span style={{color:"var(--ac)",textTransform:"none",letterSpacing:0,fontWeight:400}}> ✓ {name}</span>}</label>
      <div className="pills">
        {companies.map(c=><div key={c} className={"pt"+(name===c?" on":"")} onClick={()=>setName(c)}>{c}</div>)}
        <div className={"pt"+(add?" ob":"")} onClick={()=>setAdd(!add)} style={{borderStyle:"dashed"}}>＋ New</div>
      </div>
      {add&&<div className="ar" style={{marginTop:8}}>
        <input placeholder="Company name…" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doAdd()}/>
        <button className="btn bp bsm" onClick={doAdd}>Add</button>
        <button className="btn bs bsm" onClick={()=>setAdd(false)}>✕</button>
      </div>}
    </div>}
  </>;
}

function SvcPicker({services,sel,onSel,onAdd,cls}){
  const [add,setAdd]=useState(false);const [val,setVal]=useState("");
  const doAdd=()=>{const n=val.trim();if(n){onAdd(n);onSel(n);setVal("");setAdd(false);}};
  const col=cls==="ob"?"var(--bl)":cls==="og"?"var(--gn)":"var(--ac)";
  return <div className="f">
    <label>Service{sel&&<span style={{color:col,textTransform:"none",letterSpacing:0,fontWeight:400}}> ✓ {sel}</span>}</label>
    <div className="pills">
      {services.map(s=><div key={s} className={"pt"+(sel===s?" "+cls:"")} onClick={()=>onSel(s)}>{s}</div>)}
      <div className={"pt"+(add?" ob":"")} onClick={()=>setAdd(!add)} style={{borderStyle:"dashed"}}>＋ Add</div>
    </div>
    {add&&<div className="ar" style={{marginTop:8}}>
      <input placeholder="New service…" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doAdd()}/>
      <button className="btn bp bsm" onClick={doAdd}>Add</button>
      <button className="btn bs bsm" onClick={()=>setAdd(false)}>✕</button>
    </div>}
  </div>;
}


const FatturaPicker=({val,onChange})=><div className="f">
  <label>Fattura <span style={{fontSize:10,color:"var(--mt)",textTransform:"none",letterSpacing:0,fontWeight:400}}>(Invoice required?)</span></label>
  <div className="pills">
    <div className={"pt"+(val===true?" on":"")} style={val===true?{background:"rgba(29,200,160,.2)",borderColor:"var(--ac)",color:"var(--ac)"}:{}} onClick={()=>onChange(true)}>✅ Yes — Issue Invoice</div>
    <div className={"pt"+(val===false?" on":"")} style={val===false?{background:"rgba(107,122,153,.15)",borderColor:"var(--mt)",color:"var(--mt)"}:{}} onClick={()=>onChange(false)}>❌ No Invoice</div>
  </div>
</div>;

const PmPicker=({val,onChange})=><div className="f"><label>Payment Method (How they paid)</label><div className="pills">{PMS.map(m=><div key={m.id} className={"pt"+(val===m.id?" on":"")} onClick={()=>onChange(m.id)}>{m.icon} {m.label}</div>)}</div></div>;

function PayBox({bill,paid}){
  const b=parseFloat(bill)||0,p=parseFloat(paid)||0,d=Math.max(0,b-p);
  const s=b>0?(p>=b?"paid":p<=0?"unpaid":"partial"):null;
  if(!b&&!p)return null;
  return <div className="pbox">
    <div className="pi"><div className="lbl">Bill</div><div className="val" style={{color:"var(--bl)"}}>{money(b)}</div></div>
    <div className="pi"><div className="lbl">Paid</div><div className="val" style={{color:"var(--gn)"}}>{money(p)}</div></div>
    <div className="pi"><div className="lbl">Due</div><div className="val" style={{color:d>0?"var(--rd)":"var(--gn)"}}>{money(d)}</div></div>
    {s&&<div className="pi"><div className="lbl">Status</div><div style={{marginTop:4}}><span style={{display:"inline-block",padding:"3px 9px",borderRadius:20,fontSize:11,fontWeight:700,background:STATUS[s].bg,color:STATUS[s].color}}>{STATUS[s].label}</span></div></div>}
  </div>;
}

function ManageList({icon,title,items,onAdd,onDel,ph}){
  const [val,setVal]=useState("");
  return <div className="ms">
    <div className="ms-t">{icon} {title} <span style={{color:"var(--mt)",fontWeight:400,fontSize:11}}>({items.length})</span></div>
    {items.map(x=><div key={x} className="ir"><span className="iname">{x}</span><button className="btn bd-btn bsm" onClick={()=>onDel(x)}>✕</button></div>)}
    <div className="ar">
      <input placeholder={ph} value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&val.trim()&&(onAdd(val.trim()),setVal(""))}/>
      <button className="btn bp bsm" onClick={()=>{if(val.trim()){onAdd(val.trim());setVal("");}}}>＋</button>
    </div>
  </div>;
}

function EditModal({job,services,companies,recentClients=[],onSave,onClose,onAddSvc,onAddCo}){
  const mc=job.workshopType==="mechanic";
  const [ct,setCt]=useState(job.clientType);const [cn,setCn]=useState(job.clientName);
  const [svc,setSvc]=useState(job.service);const [bill,setBill]=useState(String(job.jobBill||0));
  const [paid,setPaid]=useState(String(job.amountPaid||0));const [prt,setPrt]=useState(String(job.partsCost||0));
  const [pm,setPm]=useState(job.paymentMethod||"cash");const [fat,setFat]=useState(job.fattura||false);const [nte,setNte]=useState(job.note||"");
  const [err,setErr]=useState("");
  const save=()=>{
    if(!cn.trim()){setErr(ct==="private"?"Enter name.":"Select company.");return;}
    if(!svc){setErr("Select service.");return;}
    const b=parseFloat(bill)||0;if(b<=0){setErr("Enter job bill.");return;}
    const p=parseFloat(paid)||0,pc=parseFloat(prt)||0,d=Math.max(0,b-p),st=p>=b?"paid":p<=0?"unpaid":"partial";
    onSave({...job,clientType:ct,clientName:cn.trim(),service:svc,note:nte.trim(),jobBill:b,amountPaid:p,dueAmount:d,paymentStatus:st,amount:b,paymentMethod:pm,fattura:fat,...(mc?{partsCost:pc,profit:p-pc}:{})});
  };
  return <div className="mbg" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="mt-t">✏️ EDIT JOB</div>
      {err&&<div className="err">{err}</div>}
      <ClientPicker type={ct} setType={setCt} name={cn} setName={setCn} companies={companies} recentClients={recentClients} onAddCo={onAddCo}/>
      <SvcPicker services={services} sel={svc} onSel={setSvc} onAdd={onAddSvc} cls={mc?"og":"ob"}/>
      <div className={mc?"fg3":"fg"} style={{marginTop:4}}>
        <div className="f"><label>Job Bill (SAR)</label><input type="number" inputMode="decimal" value={bill} onChange={e=>setBill(e.target.value)}/></div>
        <div className="f"><label>Amount Paid (SAR)</label><input type="number" inputMode="decimal" value={paid} onChange={e=>setPaid(e.target.value)}/></div>
        {mc&&<div className="f"><label>Parts Cost (SAR)</label><input type="number" inputMode="decimal" value={prt} onChange={e=>setPrt(e.target.value)}/></div>}
      </div>
      <PayBox bill={bill} paid={paid}/>
      <PmPicker val={pm} onChange={setPm}/>
      <FatturaPicker val={fat} onChange={setFat}/>
      <div className="f"><label>Note</label><input value={nte} onChange={e=>setNte(e.target.value)} placeholder="Optional…"/></div>
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button className="btn bp" style={{flex:1}} onClick={save}>💾 Save</button>
        <button className="btn bs" onClick={onClose}>Cancel</button>
      </div>
    </div>
  </div>;
}

function PayModal({job,onSave,onClose}){
  const bill=job.jobBill||0,prev=job.amountPaid||0,d=Math.max(0,bill-prev);
  const [amt,setAmt]=useState(String(d));const [err,setErr]=useState("");
  const save=()=>{const a=parseFloat(amt);if(isNaN(a)||a<=0){setErr("Enter valid amount.");return;}const np=Math.min(bill,prev+a),nd=Math.max(0,bill-np),st=np>=bill?"paid":"partial";onSave({...job,amountPaid:np,dueAmount:nd,paymentStatus:st,...(job.workshopType==="mechanic"?{profit:np-(job.partsCost||0)}:{})});};
  return <div className="mbg" onClick={onClose}>
    <div className="modal" style={{width:340}} onClick={e=>e.stopPropagation()}>
      <div className="mt-t">💳 RECORD PAYMENT</div>
      <div style={{background:"var(--s2)",borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:6,fontSize:14}}>{job.clientName} — {job.service}</div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          {[["Bill",bill,"var(--bl)"],["Paid",prev,"var(--gn)"],["Due",d,"var(--rd)"]].map(([lbl,v,col])=>(
            <div key={lbl}><div style={{fontSize:10,color:"var(--mt)",fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>{lbl}</div><div style={{fontFamily:"Bebas Neue",fontSize:20,color:col}}>{money(v)}</div></div>
          ))}
        </div>
      </div>
      {err&&<div className="err">{err}</div>}
      <div className="f"><label>Payment Amount (SAR)</label><input type="number" inputMode="decimal" value={amt} onChange={e=>setAmt(e.target.value)} autoFocus/></div>
      <div style={{display:"flex",gap:8}}>
        <button className="btn bp" style={{flex:1}} onClick={save}>✓ Record</button>
        <button className="btn bs" onClick={onClose}>Cancel</button>
      </div>
    </div>
  </div>;
}

// ── START JOB MODAL ───────────────────────────────────────────────────────────
function StartJobModal({companies,services,recentClients=[],isMC,hasRunning,onStart,onClose,onAddCo,onAddSvc}){
  const [ct,setCt]=useState("private");const [cn,setCn]=useState("");const [svc,setSvc]=useState("");const [err,setErr]=useState("");
  const go=()=>{
    if(!cn.trim()){setErr(ct==="private"?"Enter client name.":"Select a company.");return;}
    if(!svc){setErr("Select a service.");return;}
    onStart(ct,cn.trim(),svc);
  };
  return <div className="mbg" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="mt-t">▶ START NEW JOB</div>
      {hasRunning&&<div style={{background:"rgba(255,169,64,.1)",border:"1px solid rgba(255,169,64,.25)",borderRadius:8,padding:"9px 12px",marginBottom:12,fontSize:12,color:"var(--or)"}}>⚠️ Current job will be paused automatically</div>}
      {err&&<div className="err">{err}</div>}
      <ClientPicker type={ct} setType={setCt} name={cn} setName={setCn} companies={companies} recentClients={recentClients} onAddCo={onAddCo}/>
      <SvcPicker services={services} sel={svc} onSel={setSvc} onAdd={onAddSvc} cls={isMC?"og":"ob"}/>
      <div style={{display:"flex",gap:8,marginTop:14}}>
        <button className="btn bp" style={{flex:1,padding:"12px",fontSize:14}} onClick={go}>▶ Start Timer</button>
        <button className="btn bs" onClick={onClose}>Cancel</button>
      </div>
    </div>
  </div>;
}

// ── ACTIVE JOB CARD ───────────────────────────────────────────────────────────
function ActiveJobCard({session,canResume,onPause,onResume,onStop}){
  const [,tick]=useState(0);
  const isRun=session.status==="running";
  useEffect(()=>{if(!isRun)return;const t=setInterval(()=>tick(n=>n+1),1000);return()=>clearInterval(t);},[isRun]);
  const el=getEl(session),col=isRun?"var(--gn)":"var(--or)";
  return <div className={"job-card "+(isRun?"running":"paused")}>
    <div className="job-info">
      <div className="job-client">{session.clientName}</div>
      <div className="job-service">{session.service}</div>
      <div className="job-meta">
        {isRun?<><span className="dot"/>Running</>:"⏸ Paused"}
        {"   "}Started {fmtT(session.startedAt)}
      </div>
    </div>
    <div className="job-timer" style={{color:col}}>{fmtDur(el)}</div>
    <div className="job-controls">
      {isRun
        ?<button className="btn bsm" style={{background:"var(--or)",color:"#000",border:"none",fontWeight:700,minWidth:60}} onClick={onPause}>⏸ Pause</button>
        :<button className="btn bsm" style={{background:canResume?"var(--gn)":"var(--s2)",color:canResume?"#000":"var(--mt)",border:canResume?"none":"1px solid var(--bd)",fontWeight:700,minWidth:60,cursor:canResume?"pointer":"not-allowed"}} onClick={canResume?onResume:undefined} title={!canResume?"Pause the running job first":""}>▶ Resume</button>
      }
      <button className="btn bd-btn bsm" style={{minWidth:60,fontWeight:700}} onClick={onStop}>⏹ Stop</button>
    </div>
  </div>;
}

// ── COMPLETE JOB MODAL ────────────────────────────────────────────────────────
function CompleteJobModal({session,isMC,onSave,onClose}){
  const endedAt=useRef(new Date().toISOString()).current;
  const totalMs=getEl(session);
  const [bill,setBill]=useState("");const [paid,setPaid]=useState("");const [prt,setPrt]=useState("");
  const [pm,setPm]=useState("cash");const [fat,setFat]=useState(false);const [nte,setNte]=useState("");const [err,setErr]=useState("");
  const save=()=>{
    const b=parseFloat(bill)||0;if(b<=0){setErr("Enter the job bill.");return;}
    const p=parseFloat(paid)||0,pc=parseFloat(prt)||0,d=Math.max(0,b-p),st=p>=b?"paid":p<=0?"unpaid":"partial";
    onSave({
      id:uid(),workerId:session.wid,workerName:session.wname,workshopType:isMC?"mechanic":"carwash",
      clientType:session.clientType,clientName:session.clientName,service:session.service,
      jobBill:b,amount:b,amountPaid:p,partsCost:isMC?pc:0,profit:isMC?p-pc:0,
      dueAmount:d,paymentStatus:st,paymentMethod:pm,fattura:fat,note:nte.trim(),
      date:toDay(),timestamp:new Date().toISOString(),
      startedAt:session.startedAt,endedAt,durationMs:totalMs,
    },{...session,status:"completed",endedAt,totalMs,accMs:totalMs});
  };
  return <div className="mbg" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="mt-t">⏹ COMPLETE JOB</div>
      {/* Timing summary */}
      <div style={{background:"var(--s2)",border:"1px solid var(--bd)",borderRadius:10,padding:14,marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>{session.clientName} — {session.service}</div>
        <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:10,color:"var(--mt)",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:3}}>🕐 Started</div>
            <div style={{fontSize:15,fontWeight:600}}>{fmtT(session.startedAt)}</div>
          </div>
          <div style={{color:"var(--mt)",fontSize:18,alignSelf:"flex-end",paddingBottom:2}}>→</div>
          <div>
            <div style={{fontSize:10,color:"var(--mt)",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:3}}>🕐 Ended</div>
            <div style={{fontSize:15,fontWeight:600}}>{fmtT(endedAt)}</div>
          </div>
          <div style={{marginLeft:"auto"}}>
            <div style={{fontSize:10,color:"var(--mt)",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:3}}>⏱ Duration</div>
            <div style={{fontFamily:"Bebas Neue",fontSize:26,letterSpacing:2,color:"var(--ac)"}}>{fmtDur(totalMs)}</div>
          </div>
        </div>
      </div>
      {/* Payment */}
      {err&&<div className="err">{err}</div>}
      <div className={isMC?"fg3":"fg"}>
        <div className="f"><label>Job Bill (SAR)</label><input type="number" inputMode="decimal" placeholder="Total charge" value={bill} onChange={e=>setBill(e.target.value)} autoFocus/></div>
        <div className="f"><label>Amount Paid (SAR)</label><input type="number" inputMode="decimal" placeholder="0 if not paid" value={paid} onChange={e=>setPaid(e.target.value)}/></div>
        {isMC&&<div className="f"><label>Parts Cost (SAR)</label><input type="number" inputMode="decimal" placeholder="0 if none" value={prt} onChange={e=>setPrt(e.target.value)}/></div>}
      </div>
      <PayBox bill={bill} paid={paid}/>
      <PmPicker val={pm} onChange={setPm}/>
      <FatturaPicker val={fat} onChange={setFat}/>
      <div className="f"><label>Note</label><input placeholder="Optional…" value={nte} onChange={e=>setNte(e.target.value)}/></div>
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button className="btn bp" style={{flex:1,padding:"12px",fontSize:14}} onClick={save}>✓ Save & Complete Job</button>
        <button className="btn bs" onClick={onClose}>Cancel</button>
      </div>
    </div>
  </div>;
}

// ── LIVE TAB ──────────────────────────────────────────────────────────────────
function LiveTab({sessions}){
  const [,tick]=useState(0);
  useEffect(()=>{const t=setInterval(()=>tick(n=>n+1),1000);return()=>clearInterval(t);},[]);
  const run=sessions.filter(s=>s.status==="running"),psd=sessions.filter(s=>s.status==="paused");
  const done=sessions.filter(s=>s.status==="completed"&&s.endedAt&&new Date(s.endedAt).toDateString()===new Date().toDateString()).sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt));

  </div>;
}

// ── CHARTS ────────────────────────────────────────────────────────────────────
function RevenueChart({jobs}){
  const days=Array.from({length:7},(_,i)=>{
    const d=new Date();d.setDate(d.getDate()-(6-i));
    const ds=d.toISOString().split("T")[0];
    const dj=jobs.filter(j=>j.date===ds);
    return{day:d.toLocaleDateString("en-GB",{weekday:"short"}),
      cw:dj.filter(j=>j.workshopType==="carwash").reduce((s,j)=>s+(j.jobBill||0),0),
      mc:dj.filter(j=>j.workshopType==="mechanic").reduce((s,j)=>s+(j.profit||0),0)};
  });
  const maxVal=Math.max(...days.map(d=>Math.max(d.cw,d.mc)),1);
  return <div style={{padding:"0 4px"}}>
    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:150,marginBottom:6}}>
      {days.map((d,i)=><div key={i} style={{flex:1,display:"flex",gap:2,alignItems:"flex-end",height:"100%"}}>
        <div style={{flex:1,background:"#4F9EF8",borderRadius:"3px 3px 0 0",height:`${Math.max((d.cw/maxVal)*100,d.cw?2:0)}%`,transition:"height .3s",title:`CW: ${money(d.cw)}`}}/>
        <div style={{flex:1,background:"#1DC8A0",borderRadius:"3px 3px 0 0",height:`${Math.max((d.mc/maxVal)*100,d.mc?2:0)}%`,transition:"height .3s"}}/>
      </div>)}
    </div>
    <div style={{display:"flex",gap:6}}>
      {days.map((d,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:9,color:"var(--mt)"}}>{d.day}</div>)}
    </div>
    <div style={{display:"flex",gap:12,marginTop:8,justifyContent:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"var(--mt)"}}><div style={{width:10,height:10,borderRadius:2,background:"#4F9EF8"}}/>Car Wash</div>
      <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"var(--mt)"}}><div style={{width:10,height:10,borderRadius:2,background:"#1DC8A0"}}/>MC Profit</div>
    </div>
  </div>;
}
function ServiceDonut({jobs}){
  const mp={};jobs.forEach(j=>{mp[j.service]=(mp[j.service]||0)+1;});
  const data=Object.entries(mp).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const total=data.reduce((s,[,v])=>s+v,0)||1;
  const COLS=["#1DC8A0","#4F9EF8","#FFA940","#FF6B6B","#A78BFA"];
  if(!data.length)return <div className="empty">No data yet</div>;
  return <div style={{padding:"4px 0"}}>
    {data.map(([name,count],i)=><div key={name} style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
        <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:COLS[i],display:"inline-block"}}/>{name}</span>
        <span style={{color:"var(--mt)",fontSize:11}}>{count} ({Math.round(count/total*100)}%)</span>
      </div>
      <div style={{height:5,background:"var(--s2)",borderRadius:3,overflow:"hidden"}}>
        <div style={{width:`${count/total*100}%`,height:"100%",background:COLS[i],borderRadius:3,transition:"width .3s"}}/>
      </div>
    </div>)}
  </div>;
}

function ChangePwModal({user,onClose,onSave}){
  const [cur,setCur]=useState("");const [pw1,setPw1]=useState("");const [pw2,setPw2]=useState("");const [err,setErr]=useState("");const [ok,setOk]=useState(false);
  const save=async()=>{
    if(!cur){setErr("Enter current password.");return;}
    if(cur!==user.password){setErr("Current password is wrong.");return;}
    if(pw1.length<8){setErr("New password must be at least 8 characters.");return;}
    if(!/[A-Z]/.test(pw1)){setErr("Must include at least one uppercase letter.");return;}
    if(!/[0-9]/.test(pw1)){setErr("Must include at least one number.");return;}
    if(pw1!==pw2){setErr("Passwords do not match.");return;}
    await onSave(pw1);setOk(true);
  };
  return <div className="mbg" onClick={onClose}>
    <div className="modal" style={{width:360}} onClick={e=>e.stopPropagation()}>
      <div className="mt-t">🔑 CHANGE PASSWORD</div>
      {ok
        ?<div style={{textAlign:"center",padding:"20px 0"}}>
          <div style={{fontSize:36,marginBottom:10}}>✅</div>
          <div style={{fontWeight:700,marginBottom:6}}>Password changed!</div>
          <button className="btn bp bfull" style={{marginTop:10}} onClick={onClose}>Done</button>
        </div>
        :<>
          {err&&<div className="err">{err}</div>}
          <div style={{background:"var(--s2)",borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:12,color:"var(--mt)"}}>
            Password must be at least 8 characters, include one uppercase letter and one number.
          </div>
          <div className="f"><label>Current Password</label><input type="password" value={cur} onChange={e=>setCur(e.target.value)} autoFocus/></div>
          <div className="f"><label>New Password</label><input type="password" value={pw1} onChange={e=>setPw1(e.target.value)}/></div>
          <div className="f"><label>Confirm New Password</label><input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/></div>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button className="btn bp" style={{flex:1}} onClick={save}>Save Password</button>
            <button className="btn bs" onClick={onClose}>Cancel</button>
          </div>
        </>
      }
    </div>
  </div>;
}

function LoginPage({users,onLogin}){
  const [un,setUn]=useState("");const [pw,setPw]=useState("");const [err,setErr]=useState("");
  const go=()=>{const u=un.trim().toLowerCase(),p=pw.trim();if(!u||!p){setErr("Enter username and password.");return;}const pool=users.length>0?users:DEF_USERS;const found=pool.find(x=>x.username.toLowerCase()===u&&x.password===p);if(found)onLogin(found);else setErr("Wrong username or password.");};
  return <div className="lw"><G/>
    <div className="lc">
      <div className="logo-big">🔧 AutoShop</div>
      <div className="logo-sub">Workshop Management System</div>
      {err&&<div className="err">{err}</div>}
      <div className="f"><label>Username</label><input value={un} onChange={e=>setUn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="Enter username" autoFocus/></div>
      <div className="f"><label>Password</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="Enter password"/></div>
      <button className="btn bp bfull" style={{marginTop:10,padding:"13px",fontSize:15}} onClick={go}>Sign In →</button>
      <div className="hint-box" style={{fontSize:11,color:"var(--mt)",textAlign:"center"}}>Contact your administrator for login details.</div>
    </div>
  </div>;
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
// Local storage helpers (persists in browser even if Supabase unreachable)
const lsGet=async(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const lsSave=async(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const LSK={j:"as3_j",u:"as3_u",co:"as3_co",cw:"as3_cw",mc:"as3_mc",s:"as3_s"};

function App(){
  const [users,setUsers]=useState(DEF_USERS);
  const [jobs,setJobs]=useState([]);
  const [companies,setCompanies]=useState([]);
  const [cwSvc,setCwSvc]=useState([]);
  const [mcSvc,setMcSvc]=useState([]);
  const [sessions,setSessions]=useState([]);
  const [me,setMe]=useState(null);
  const [ready,setReady]=useState(false);
  const [dbStatus,setDbStatus]=useState("connecting");

  const load=async()=>{
    // Step 1: load local data immediately so UI shows fast
    const [lj,lco,lcw,lmc,ls,lu]=await Promise.all([
      lsGet(LSK.j,[]),lsGet(LSK.co,[]),lsGet(LSK.cw,[]),lsGet(LSK.mc,[]),lsGet(LSK.s,[]),lsGet(LSK.u,DEF_USERS)
    ]);
    if(lj.length)setJobs(lj);
    if(lco.length)setCompanies(lco); else setCompanies([]);
    if(lcw.length)setCwSvc(lcw); else setCwSvc([]);
    if(lmc.length)setMcSvc(lmc); else setMcSvc([]);
    if(ls.length)setSessions(ls);
    if(lu.length)setUsers(lu);
    setReady(true);

    // Step 2: sync with Supabase in background
    try{
      const [u,j,co,cw,mc,s]=await Promise.all([
        sbGet("users","select=*"),
        sbGet("jobs","select=*&order=created_at.desc"),
        sbGet("companies","select=name&order=name"),
        sbGet("cw_services","select=name&order=name"),
        sbGet("mc_services","select=name&order=name"),
        sbGet("timer_sessions","select=*"),
      ]);
      if(Array.isArray(j)){const jj=j.map(db2j);setJobs(jj);lsSave(LSK.j,jj);}
      if(Array.isArray(co)&&co.length){const cc=co.map(r=>r.name);setCompanies(cc);lsSave(LSK.co,cc);}
      if(Array.isArray(cw)&&cw.length){const cc=cw.map(r=>r.name);setCwSvc(cc);lsSave(LSK.cw,cc);}
      if(Array.isArray(mc)&&mc.length){const cc=mc.map(r=>r.name);setMcSvc(cc);lsSave(LSK.mc,cc);}
      if(Array.isArray(s)){const ss=s.map(db2s);setSessions(ss);lsSave(LSK.s,ss);}
      if(Array.isArray(u)&&u.length){setUsers(u);lsSave(LSK.u,u);}
      setDbStatus("online");
    }catch(e){setDbStatus("offline");}
  };
  useEffect(()=>{load();},[]);

  // All writes go to local storage first, then Supabase
  const addJob=async j=>{
    const next=[j,...jobs];setJobs(next);lsSave(LSK.j,next);
    sbPost("jobs",j2db(j));
  };
  const updJob=async j=>{
    const next=jobs.map(x=>x.id===j.id?j:x);setJobs(next);lsSave(LSK.j,next);
    sbPatch("jobs","id=eq."+j.id,j2db(j));
  };
  const delJob=async id=>{
    const next=jobs.filter(x=>x.id!==id);setJobs(next);lsSave(LSK.j,next);
    sbDel("jobs","id=eq."+id);
  };
  const addW=async w=>{
    const next=[...users,w];setUsers(next);lsSave(LSK.u,next);
    sbPost("users",w);
  };
  const changePw=async(id,pw)=>{
    const next=users.map(u=>u.id===id?{...u,password:pw}:u);
    setUsers(next);lsSave(LSK.u,next);
    await sbPatch("users","id=eq."+id,{password:pw});
  };
  const delW=async id=>{
    const next=users.filter(u=>u.id!==id);setUsers(next);lsSave(LSK.u,next);
    sbDel("users","id=eq."+id);
  };
  const addCo=async n=>{
    if(companies.includes(n))return;
    const next=[...companies,n].sort();setCompanies(next);lsSave(LSK.co,next);
    sbPost("companies",{name:n});
  };
  const delCo=async n=>{
    const next=companies.filter(c=>c!==n);setCompanies(next);lsSave(LSK.co,next);
    sbDel("companies","name=eq."+encodeURIComponent(n));
  };
  const addCw=async n=>{
    if(cwSvc.includes(n))return;
    const next=[...cwSvc,n];setCwSvc(next);lsSave(LSK.cw,next);
    sbPost("cw_services",{name:n});
  };
  const delCw=async n=>{
    const next=cwSvc.filter(s=>s!==n);setCwSvc(next);lsSave(LSK.cw,next);
    sbDel("cw_services","name=eq."+encodeURIComponent(n));
  };
  const addMc=async n=>{
    if(mcSvc.includes(n))return;
    const next=[...mcSvc,n];setMcSvc(next);lsSave(LSK.mc,next);
    sbPost("mc_services",{name:n});
  };
  const delMc=async n=>{
    const next=mcSvc.filter(s=>s!==n);setMcSvc(next);lsSave(LSK.mc,next);
    sbDel("mc_services","name=eq."+encodeURIComponent(n));
  };
  const startS=async s=>{
    const next=[...sessions.filter(x=>!(x.wid===s.wid&&x.status==="running")),s];setSessions(next);lsSave(LSK.s,next);
    sbPost("timer_sessions",s2db(s));
  };
  const pauseS=async s=>{
    const next=sessions.map(x=>x.id===s.id?s:x);setSessions(next);lsSave(LSK.s,next);
    sbPatch("timer_sessions","id=eq."+s.id,s2db(s));
  };
  const resumeS=async s=>{
    const next=sessions.map(x=>x.id===s.id?s:x);setSessions(next);lsSave(LSK.s,next);
    sbPatch("timer_sessions","id=eq."+s.id,s2db(s));
  };
  const stopS=async s=>{
    const next=sessions.map(x=>x.id===s.id?s:x);setSessions(next);lsSave(LSK.s,next);
    sbPatch("timer_sessions","id=eq."+s.id,s2db(s));
  };

  if(!ready)return <div style={{minHeight:"100vh",background:"#0D1117",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}><G/><div style={{fontFamily:"Bebas Neue,sans-serif",fontSize:32,letterSpacing:3,color:"#1DC8A0"}}>🔧 AutoShop</div><div style={{fontSize:13,color:"#6B7A99"}}>Loading your data…</div></div>;
  if(!me)return <LoginPage users={users} onLogin={setMe}/>;
  const sh={companies,onAddCo:addCo};
  const dbDot=dbStatus==="online"?{color:"#1DC8A0",title:"Synced with cloud"}:dbStatus==="offline"?{color:"#FFA940",title:"Saved locally (cloud unavailable)"}:{color:"#6B7A99",title:"Connecting…"};
  if(me.role==="worker"&&me.type==="carwash")return <WorkerPage user={me} jobs={jobs} services={cwSvc} sessions={sessions} isMC={false} onAdd={addJob} onUpd={updJob} onAddSvc={addCw} onStartS={startS} onPauseS={pauseS} onResumeS={resumeS} onStopS={stopS} onLogout={()=>setMe(null)} onChangePw={changePw} {...sh}/>;
  if(me.role==="worker"&&me.type==="mechanic")return <WorkerPage user={me} jobs={jobs} services={mcSvc} sessions={sessions} isMC={true} onAdd={addJob} onUpd={updJob} onAddSvc={addMc} onStartS={startS} onPauseS={pauseS} onResumeS={resumeS} onStopS={stopS} onLogout={()=>setMe(null)} onChangePw={changePw} {...sh}/>;
  return <OwnerPage user={me} users={users} jobs={jobs} companies={companies} cwSvc={cwSvc} mcSvc={mcSvc} sessions={sessions} onAddW={addW} onDelW={delW} onDelJ={delJob} onUpdJ={updJob} onAddCo={addCo} onDelCo={delCo} onAddCw={addCw} onDelCw={delCw} onAddMc={addMc} onDelMc={delMc} onLogout={()=>setMe(null)} onRefresh={load} dbStatus={dbStatus}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

  </script>
</body>
</html>
